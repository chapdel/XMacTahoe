# XMacTahoe: Ghostty looks like the other windows of the theme (managed block, see extra/xmactahoe-ghostty)
window-decoration = server
gtk-titlebar-style = native
window-show-tab-bar = auto
theme = light:XMacTahoe Light,dark:XMacTahoe
font-family = JetBrains Mono
font-size = 11
background-opacity = 1
background-blur = false
window-padding-x = 8
window-padding-y = 6
