name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: shellcheck
        run: |
          files=$(for f in install.sh uninstall.sh bin/* extra/xmactahoe-* tools/*.sh; do head -1 "$f" | grep -q bash && echo "$f"; done)
          echo "$files"
          shellcheck -S warning $files
      - name: package consistency
        run: python3 tools/check-package.py
